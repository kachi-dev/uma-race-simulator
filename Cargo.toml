[package]
name = "uma_race_sim"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
base64 = "0.22"

[profile.dev]
opt-level = 1
